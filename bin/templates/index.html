<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD-LIC-HP | Dashboard</title>
    <style>
        /* Estilos para Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--card-bg);
            padding-bottom: 0.5rem;
        }

        .tab-button {
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-weight: 600;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }

        .tab-button.active {
            background: rgba(6, 150, 215, 0.1);
            color: var(--primary);
        }

        .tab-content { display: none; min-height: 400px; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Estilo Consola */
        pre {
            background: #0a0f1e;
            padding: 1.5rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            color: #10b981;
            border: 1px solid #1e293b;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.4;
        }

        /* Estilo Inventario */
        .inventory-list {
            background: var(--card-bg);
            border-radius: 1rem;
            overflow: hidden;
            width: 100%;
        }

        .inventory-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center;
        }

        .inventory-header {
            background: rgba(255,255,255,0.02);
            font-weight: bold;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Autodesk License Manager</h1>
            <p style="color: var(--text-dim)">Consola de administración visual</p>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <div id="active-count" class="status-badge" style="background: rgba(6, 150, 215, 0.1); color: var(--primary);">
                0 Licencias en Uso
            </div>
            <div id="server-status" class="status-badge status-down">
                <span>Server Offline</span>
            </div>
        </div>
    </div>

    <!-- Navegación por Pestañas -->
    <div class="tabs">
        <button class="tab-button active" onclick="showTab('tab-monitoreo')">📊 Monitoreo de Uso</button>
        <button class="tab-button" onclick="showTab('tab-inventario')">📦 Inventario General</button>
    </div>

    <!-- Pestaña 1: Monitoreo -->
    <div id="tab-monitoreo" class="tab-content active">
        <div class="section-title" id="ongoing-usage-title" style="color: var(--success); margin-top:0;">● Usuarios Activos Ahora</div>
        <div class="grid" id="active-users-grid" style="margin-bottom: 3rem;">
            <!-- Placeholder si no hay nadie -->
            <div id="no-users" style="color: var(--text-dim); padding: 2rem; background: rgba(255,255,255,0.02); border-radius: 1rem; text-align: center; grid-column: 1/-1;">
                No hay licencias en uso actualmente.
            </div>
        </div>

        <div class="section-title">Consola del Servidor (Live Log)</div>
        <pre id="raw-log">Esperando datos del servidor...</pre>
    </div>

    <!-- Pestaña 2: Inventario -->
    <div id="tab-inventario" class="tab-content">
        <div class="section-title" style="margin-top:0;">Listado Maestro de Licencias</div>
        <div class="inventory-list" id="inventory-container">
            <div class="inventory-item inventory-header">
                <div>Producto</div>
                <div>Código</div>
                <div>Disponibles</div>
                <div>Uso %</div>
            </div>
            <div id="inventory-items">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn-primary" onclick="updateStatus()">Refrescar Ahora</button>
        <button class="btn-primary" style="background: #334155" onclick="reloadServer()">Recargar Archivo LIC</button>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                // Header Status
                const statusBadge = document.getElementById('server-status');
                if (data.server_up) {
                    statusBadge.className = 'status-badge status-up';
                    statusBadge.innerHTML = '<span>● Conectado</span>';
                } else {
                    statusBadge.className = 'status-badge status-down';
                    statusBadge.innerHTML = '<span>● Error de Conexión</span>';
                }

                document.getElementById('active-count').innerText = `${data.total_active} Licencias en Uso`;

                // Render Pestaña Monitoreo
                const activeGrid = document.getElementById('active-users-grid');
                const noUsersDiv = document.getElementById('no-users');
                activeGrid.innerHTML = '';
                
                if (data.total_active > 0) {
                    noUsersDiv.style.display = 'none';
                    data.usage.filter(f => f.used > 0).forEach(f => {
                        f.users.forEach(u => {
                            const badgeColor = u.is_borrowed ? '#f59e0b' : 'var(--success)';
                            const badgeText = u.is_borrowed ? 'PRESTADA (BORROW)' : 'ACTIVA AHORA';
                            const extraInfo = u.is_borrowed ? `<div style="margin-top: 4px; color: #fbbf24; font-weight: 600;">⏳ ${u.borrow_info}</div>` : '';
                            
                            activeGrid.innerHTML += `
                                <div class="card" style="border-left: 4px solid ${badgeColor};">
                                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
                                        <div class="feature-name" style="color: ${badgeColor}; font-size: 0.8rem; font-weight: bold;">${f.product}</div>
                                        <div style="font-size: 0.65rem; background: ${badgeColor}22; color: ${badgeColor}; padding: 2px 6px; border-radius: 4px; border: 1px solid ${badgeColor}44;">${badgeText}</div>
                                    </div>
                                    <div style="font-weight: bold; font-size: 1.2rem; margin-bottom: 0.5rem;">👤 ${u.user}</div>
                                    <div style="font-size: 0.85rem; color: var(--text-dim);">
                                        <div>💻 Equipo: ${u.host}</div>
                                        <div>⏰ Inicio: ${u.start}</div>
                                        ${extraInfo}
                                    </div>
                                </div>
                            `;
                        });
                    });
                } else {
                    activeGrid.appendChild(noUsersDiv);
                    noUsersDiv.style.display = 'block';
                }

                document.getElementById('raw-log').innerText = data.raw_output;

                // Render Pestaña Inventario
                const inventoryList = document.getElementById('inventory-items');
                inventoryList.innerHTML = '';
                
                data.usage.forEach(f => {
                    inventoryList.innerHTML += `
                        <div class="inventory-item">
                            <div style="font-weight: 600; color: var(--primary);">${f.product}</div>
                            <div style="font-family: monospace; font-size: 0.8rem; color: var(--text-dim);">${f.feature}</div>
                            <div>${f.total - f.used} / ${f.total}</div>
                            <div style="color: ${f.used > 0 ? 'var(--success)' : 'inherit'}">${f.percent}%</div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Error cargando status:", err);
            }
        }

        async function reloadServer() {
            if(!confirm("¿Seguro que quieres recargar el archivo de licencias?")) return;
            const res = await fetch('/api/reload');
            const data = await res.json();
            alert(data.message);
            updateStatus();
        }

        updateStatus();
        setInterval(updateStatus, {{ refresh_seconds }} * 1000);
    </script>
</body>
</html>
