services:
  autodesk-licenser:
    build: .
    image: darkleono/wine-ad-manager:latest
    platform: linux/amd64
    hostname: ${HOSTNAME_ID:-win-license-lab}
    # El HostID configurado en la licencia de Autodesk (66128fd23630):
    mac_address: ${MAC_ADDRESS:-66:12:8f:d2:36:30}
    # Permiso para cambiar la MAC por software desde entrypoint.sh:
    cap_add:
      - NET_ADMIN
    # Easypanel maneja los puertos automáticamente
    # Para Docker standalone, usar: ports en lugar de expose
    expose:
      - "27000"
      - "2080"
      - "8080"
    volumes:
      - license_data:/app
    environment:
      - MAC_ADDRESS=${MAC_ADDRESS:-66:12:8f:d2:36:30}
      - HOSTNAME_ID=${HOSTNAME_ID:-win-license-lab}
      - PORT_DASHBOARD=${PORT_DASHBOARD:-8080}
      - TZ=America/Mexico_City
      - DASHBOARD_LOGS=${DASHBOARD_LOGS:-false}
      - REFRESH_SECONDS=${REFRESH_SECONDS:-60}
    restart: always

volumes:
  license_data:
