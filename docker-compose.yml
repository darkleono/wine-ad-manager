version: '3.8'

services:
  autodesk-licenser:
    platform: linux/amd64
    build: .
    container_name: autodesk-licenser
    hostname: license-server
    restart: always
    # CRITICAL: Replace with the MAC address from your current license
    mac_address: "00:00:00:00:07:70"
    ports:
      - "27000:27000"
      - "2080:2080"
      - "8080:8080"
    volumes:
      # Mount your license file folder
      - ./licence:/var/flexlm
    environment:
      - TZ=America/Mexico_City
